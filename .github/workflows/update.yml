name: 每日自动更新

on:
  schedule:
    # 每天 00:00 和 12:00 UTC = 北京时间 08:00 / 20:00
    - cron: "0 0,12 * * *"
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write      # 允许把生成的站点数据提交回仓库（EdgeOne Pages 据此自动部署）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 调试：打印 lmsys.py 前20行
        run: head -20 scrapers/lmsys.py

      - name: 抓取 + 评分 + 生成
        run: python run.py --dry-run
        env:
          # LLM 解析（可选）：硅基流动 API Key，不配则跳过 LLM 增强
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

      - name: 提交站点数据（触发 EdgeOne Pages 自动部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新站点数据 $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
