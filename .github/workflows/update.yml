name: 每日自动更新

on:
  schedule:
    # 每天 00:00 和 12:00 UTC = 北京时间 08:00 / 20:00
    - cron: "0 0,12 * * *"
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write      # 允许把生成的站点数据提交回仓库（EdgeOne Pages 据此自动部署）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 调试：打印 lmsys.py 内容
        run: cat scrapers/lmsys.py | head -35

      - name: 强制更新 lmsys.py（确保使用最新版本）
        run: |
          echo "当前 git log:"
          git log --oneline -5
          echo "当前 lmsys.py 行数:"
          wc -l scrapers/lmsys.py
          echo "用 Python 强制替换 URL:"
          python -c "
import re
with open('scrapers/lmsys.py', 'r', encoding='utf-8') as f:
    content = f.read()
content = content.replace('lmarena-ai/arena-leaderboard', 'lmarena-ai/chatbot-arena-leaderboard')
with open('scrapers/lmsys.py', 'w', encoding='utf-8') as f:
    f.write(content)
print('替换完成')
"
          echo "替换后检查:"
          grep -n "huggingface" scrapers/lmsys.py || echo "仍未找到"

      - name: 抓取 + 评分 + 生成
        run: python run.py --dry-run
        env:
          # LLM 解析（可选）：硅基流动 API Key，不配则跳过 LLM 增强
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

      - name: 提交站点数据（触发 EdgeOne Pages 自动部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新站点数据 $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
